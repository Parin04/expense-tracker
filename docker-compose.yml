services:
  app:
    build: .
    ports:
      - "3001:3000"
    environment:
      - PORT=3000
      - DATABASE_URL=postgres://expense:expense@db:5432/expense
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=expense
      - POSTGRES_PASSWORD=expense
      - POSTGRES_DB=expense
    # เปิดไว้ให้ต่อจาก DB client ในเครื่อง (5432 ใช้กับโปรเจกต์ test แล้ว)
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expense -d expense"]
      interval: 2s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
